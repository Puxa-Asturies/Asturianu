name: Verify course

on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX 1: Upgrade pip and install packages under a clean target directory
      - name: Install LibreLingo Exporter safely
        run: |
          pip install --upgrade pip
          pip install "setuptools<66.0.0" wheel
          pip install librelingo-json-export --no-build-isolation

      # FIX 2: Dynamically locate the command-line script location and run it
      - name: Validate Course Structure
        run: |
          export PATH="$(python -c 'import sys, os; print(os.path.join(sys.prefix, "bin"))'):$PATH"
          librelingo-json-export . /tmp/output-test-delete-me
