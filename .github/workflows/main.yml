name: Verify course

on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install LibreLingo Exporter safely
        run: |
          pip install "setuptools<66.0.0" wheel
          pip install librelingo-json-export --no-build-isolation

      # FIX: Run the internal script file directly using Python
      - name: Validate Course Structure
        run: |
          SCRIPT_PATH=$(python -c "import librelingo_json_export, os; print(os.path.join(os.path.dirname(librelingo_json_export.__file__), 'export.py'))")
          python $SCRIPT_PATH . /tmp/output-test-delete-me
