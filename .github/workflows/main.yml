name: Verify course

on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Explicitly add the local python bin directory to the GitHub Actions PATH
      - name: Configure local PATH
        run: echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Install LibreLingo Exporter safely
        run: |
          pip install "setuptools<66.0.0" wheel
          pip install librelingo-json-export --no-build-isolation

      # Now the raw command will be discovered flawlessly
      - name: Validate Course Structure
        run: librelingo-json-export . /tmp/output-test-delete-me
