name: Verify course

on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Standard dependency setup that worked earlier
      - name: Install LibreLingo Exporter safely
        run: |
          pip install "setuptools<66.0.0" wheel
          pip install librelingo-json-export --no-build-isolation

      # CHANGED: Saved to './compiled-course' instead of /tmp so GitHub can find it
      - name: Validate and Compile Course Structure
        run: |
          python -c "
          import sys
          from librelingo_json_export.cli import main
          sys.argv = ['librelingo-json-export', '.', './compiled-course']
          main()
          "

      # NEW: Packages your compiled course folder into a downloadable zip file
      - name: Upload Compiled Course Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asturian-course-json
          path: ./compiled-course
