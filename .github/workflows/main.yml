name: Verify course

on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install LibreLingo Exporter safely
        run: |
          pip install "setuptools<66.0.0" wheel
          pip install librelingo-json-export --no-build-isolation

      # FIX: Call the compiler using its exact, absolute installation path
      - name: Validate Course Structure
        run: ~/.local/bin/librelingo-json-export . /tmp/output-test-delete-me
