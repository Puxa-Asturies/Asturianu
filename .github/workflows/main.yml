on: [push]

jobs:
  verify-course:
    runs-on: ubuntu-latest
    name: Verify course
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX: Force-downgrade setuptools so old PyYAML can compile safely
      - name: Downgrade setuptools for legacy PyYAML compatibility
        run: pip install "setuptools<66.0.0"

      - uses: LibreLingo/course-ci@main
